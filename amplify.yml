# AWS Amplify — admin UI (service_link_admin-main)
# App settings → Environment variables: REACT_APP_ORDER_API_URL = your API URL

version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 18
        - cd service_link_admin-main
        - npm install --legacy-peer-deps
    build:
      commands:
        - cd service_link_admin-main
        - npm run build
  artifacts:
    baseDirectory: service_link_admin-main/build
    files:
      - "**/*"
  cache:
    paths:
      - service_link_admin-main/node_modules/**/*
