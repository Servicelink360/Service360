# AWS Amplify — admin UI (service_link_admin-main)
# Override REACT_APP_ORDER_API_URL in Amplify console when API URL changes.

version: 1
env:
  variables:
    REACT_APP_ORDER_API_URL: http://3.106.200.185:5301/
    REACT_APP_MODE: PROD
    GENERATE_SOURCEMAP: false
    NODE_OPTIONS: --openssl-legacy-provider
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 18
        - node -v && npm -v
        - cd service_link_admin-main
        - npm install --legacy-peer-deps
    build:
      commands:
        - cd service_link_admin-main
        - export NODE_OPTIONS=--openssl-legacy-provider
        - export GENERATE_SOURCEMAP=false
        - npm run build
  artifacts:
    baseDirectory: service_link_admin-main/build
    files:
      - "**/*"
  cache:
    paths:
      - service_link_admin-main/node_modules/**/*
