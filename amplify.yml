# AWS Amplify — admin UI (service_link_admin-main)
# API URL: override in Amplify console if EC2 IP changes.

version: 1
env:
  variables:
    REACT_APP_ORDER_API_URL: http://3.106.200.185:5301/
    REACT_APP_MODE: PROD
    GENERATE_SOURCEMAP: false
    NODE_OPTIONS: --openssl-legacy-provider --max_old_space_size=6144
    CI: "false"
    DISABLE_ESLINT_PLUGIN: "true"
    TSC_COMPILE_ON_ERROR: "true"
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 18
        - nvm use 18
        - node -v && npm -v
        - cd service_link_admin-main/ckeditor5
        - npm install
        - npm run build
        - cd ../..
        - cd service_link_admin-main
        - npm install --legacy-peer-deps
    build:
      commands:
        - cd service_link_admin-main
        - npm run build
  artifacts:
    baseDirectory: service_link_admin-main/build
    files:
      - "**/*"
  cache:
    paths:
      - service_link_admin-main/node_modules/**/*
      - service_link_admin-main/ckeditor5/node_modules/**/*
