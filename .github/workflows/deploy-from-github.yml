# Auto-deploy Service360 to EC2 on every push to main.
# One-time setup: add GitHub repo secrets (Settings → Secrets → Actions):
#   EC2_HOST          = 13.55.122.55
#   EC2_SSH_KEY       = contents of your .pem private key
#   EC2_USER          = ubuntu  (optional)
#   API_URL           = http://13.55.122.55:5301/

name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ec2-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy API + Admin → EC2
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 45m
          script_stop: true
          script: |
            set -e
            APP_DIR="/opt/app"
            REPO="https://github.com/Servicelink360/Service360.git"
            API_URL="${{ secrets.API_URL || 'http://13.55.122.55:5301/' }}"

            if [ ! -d "$APP_DIR/.git" ]; then
              sudo mkdir -p "$APP_DIR"
              sudo git clone "$REPO" "$APP_DIR"
              sudo chown -R ubuntu:ubuntu "$APP_DIR"
            fi

            cd "$APP_DIR"
            git fetch origin main
            git reset --hard origin/main

            ENV_PROD="service_link_api-main/.env.prod"
            if [ -f "$ENV_PROD" ]; then
              sed -i "s|^BASE_UPLOAD_URL=.*|BASE_UPLOAD_URL=${API_URL}|" "$ENV_PROD"
              sed -i 's|^REDIS_IP=.*|REDIS_IP=redis|' "$ENV_PROD" || true
              grep -q '^REDIS_IP=' "$ENV_PROD" || echo 'REDIS_IP=redis' >> "$ENV_PROD"
            fi

            export REACT_APP_ORDER_API_URL="${API_URL}"
            sudo -E docker compose -f deploy/docker-compose.aws-test.yml build api admin
            sudo docker compose -f deploy/docker-compose.aws-test.yml up -d --force-recreate
            sudo docker compose -f deploy/docker-compose.aws-test.yml ps
            echo "Deployed: ${API_URL}"
