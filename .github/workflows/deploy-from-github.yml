# Fallback: full build ON EC2 (slow — use deploy-fast.yml instead).
# Disabled on push; run manually only if GitHub Actions fast deploy is unavailable.

name: Deploy to EC2 (slow fallback)

on:
  workflow_dispatch:

concurrency:
  group: ec2-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Full EC2 docker build
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 45m
          script_stop: true
          script: |
            set -e
            APP_DIR="/opt/app"
            cd "$APP_DIR"
            git fetch origin main && git reset --hard origin/main
            bash deploy/ec2-deploy.sh
