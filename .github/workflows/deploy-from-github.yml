# Optional: instant deploy via GitHub Actions (needs EC2 secrets in repo settings).
# Default auto-deploy: EC2 cron polls GitHub every 2 min (deploy/ec2-install-auto-deploy.sh).

name: Deploy to EC2 (manual)

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy API + Admin → EC2
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 45m
          script_stop: true
          script: |
            cd /opt/app
            git fetch origin main && git reset --hard origin/main
            bash deploy/ec2-deploy.sh
