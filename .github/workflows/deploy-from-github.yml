# Auto-deploy on every push to main (needs GitHub secrets — set once in browser).
# GitHub → Servicelink360/Service360 → Settings → Secrets → Actions:
#   EC2_HOST = 13.55.122.55
#   EC2_SSH_KEY = paste your .pem file contents
#   API_URL = http://13.55.122.55:5301/

name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ec2-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy API + Admin
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' }}
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 45m
          script_stop: true
          script: |
            set -e
            APP_DIR="/opt/app"
            API_URL="${{ secrets.API_URL || 'http://13.55.122.55:5301/' }}"
            if [ ! -d "$APP_DIR/.git" ]; then
              sudo mkdir -p "$APP_DIR"
              sudo git clone https://github.com/Servicelink360/Service360.git "$APP_DIR"
              sudo chown -R ubuntu:ubuntu "$APP_DIR"
            fi
            cd "$APP_DIR"
            git fetch origin main && git reset --hard origin/main
            bash deploy/ec2-deploy.sh
