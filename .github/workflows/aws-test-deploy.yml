name: AWS Test Deploy

on:
  workflow_dispatch:
    inputs:
      restore_database:
        description: Restore DB from 29__05_2026.sql
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - service_link_api-main/**
      - service_link_admin-main/**
      - deploy/**
      - .github/workflows/aws-test-deploy.yml

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
    env:
      AWS_REGION: ${{ secrets.AWS_REGION || 'ap-southeast-2' }}
      RDS_HOST: ${{ secrets.RDS_HOST }}
      RDS_PASSWORD: ${{ secrets.RDS_PASSWORD }}
      API_URL: ${{ secrets.API_URL }}
      ADMIN_S3_BUCKET: ${{ secrets.ADMIN_S3_BUCKET }}
      EC2_HOST: ${{ secrets.EC2_HOST }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Restore PostgreSQL (29__05_2026.sql)
        if: github.event_name == 'workflow_dispatch' && inputs.restore_database == true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
          chmod +x deploy/scripts/restore-database.sh
          deploy/scripts/restore-database.sh
        env:
          DATABASE_DUMP_PATH: ${{ github.workspace }}/deploy/database/29__05_2026.sql

      - name: Deploy API on EC2 (Docker Compose)
        if: env.EC2_HOST != ''
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /opt/app || cd ~/Service360
            git pull origin main
            docker compose -f deploy/docker-compose.aws-test.yml up -d --build

      - name: Build and deploy admin to S3
        if: env.ADMIN_S3_BUCKET != '' && env.API_URL != ''
        uses: actions/setup-node@v4
        with:
          node-version: "18"
      - name: Upload admin static site
        if: env.ADMIN_S3_BUCKET != '' && env.API_URL != ''
        run: |
          cat > service_link_admin-main/.env.prod <<EOF
          REACT_APP_MODE=PROD
          REACT_APP_VERSION=1.0.7
          REACT_APP_SITE_NAME=SERVICE LINK
          REACT_APP_FOOTER_BRAND=SERVICELINK
          REACT_APP_ORDER_API_URL=${{ secrets.API_URL }}
          GENERATE_SOURCEMAP=false
          EOF
          cd service_link_admin-main
          npm install --legacy-peer-deps
          export NODE_OPTIONS=--openssl-legacy-provider
          npm run build
          aws s3 sync build/ s3://${{ secrets.ADMIN_S3_BUCKET }}/ --delete
