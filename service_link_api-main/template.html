<html>
<head>
    <meta charset="UTF-8">
    <style>
        html {
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        * {
            box-sizing: border-box;
        }

        body {
            width: 740px;
            margin: 0 auto;
            font-family: 'Segoe UI', 'DejaVu Sans', 'Liberation Sans', Arial, sans-serif;
            color: #0f172a;
            background: #ffffff;
            font-size: 12.5px;
            line-height: 1.45;
        }

        .container {
            padding: 2px 4px 0;
        }

        .header {
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 2px solid #166534;
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 24px;
        }

        .logo {
            height: 72px;
            width: auto;
            display: block;
        }

        .header-contact {
            text-align: right;
            color: #475569;
            font-size: 11px;
            line-height: 1.5;
            padding-top: 4px;
        }

        .header-contact .company {
            color: #14532d;
            font-weight: 700;
            font-size: 13px;
            letter-spacing: 0.02em;
            margin-bottom: 3px;
        }

        .title-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            background: linear-gradient(105deg, #14532d 0%, #166534 42%, #22a05a 100%);
            color: #ffffff;
            padding: 14px 18px;
            border-radius: 10px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(22, 101, 52, 0.18);
        }

        .title-bar--severity-low {
            background: linear-gradient(90deg, #047857 0%, #34d399 100%);
        }

        .title-bar--severity-medium {
            background: linear-gradient(90deg, #b45309 0%, #f59e0b 100%);
        }

        .title-bar--severity-high {
            background: linear-gradient(90deg, #b91c1c 0%, #ef4444 100%);
        }

        .title-bar--severity-critical {
            background: linear-gradient(90deg, #7f1d1d 0%, #dc2626 55%, #991b1b 100%);
        }

        .title-bar .report-title {
            font-size: 19px;
            font-weight: 700;
            letter-spacing: 0.03em;
            text-transform: uppercase;
        }

        .title-bar-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .title-bar .report-date,
        .title-bar .report-severity {
            font-size: 11.5px;
            font-weight: 700;
            opacity: 0.98;
            background: rgba(255, 255, 255, 0.22);
            padding: 5px 11px;
            border-radius: 999px;
            white-space: nowrap;
            border: 1px solid rgba(255, 255, 255, 0.28);
        }

        .audit-scorecard-wrap {
            margin: 0 0 12px;
            break-inside: avoid;
            page-break-inside: avoid;
        }

        .audit-legend {
            display: flex;
            flex-wrap: wrap;
            gap: 10px 16px;
            align-items: center;
            margin: 0 0 8px;
            padding: 8px 12px;
            border: 1px solid #dbe3ec;
            border-radius: 10px;
            background: #f8fafc;
            font-size: 11.5px;
            font-weight: 600;
            color: #334155;
        }

        .audit-legend .legend-item {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            white-space: nowrap;
        }

        .audit-legend .pill {
            min-width: 28px;
            justify-content: center;
            padding: 3px 8px;
            font-size: 11px;
        }

        .audit-scorecard {
            display: flex;
            gap: 8px;
        }

        .score-card {
            flex: 1;
            min-width: 0;
            border-radius: 10px;
            padding: 10px 8px 9px;
            text-align: center;
            border: 1px solid #e2e8f0;
            background: #f8fafc;
        }

        .score-card .score-num {
            font-size: 22px;
            font-weight: 800;
            line-height: 1.1;
            letter-spacing: -0.02em;
            color: #0f172a;
        }

        .score-card .score-status {
            font-size: 12.5px;
            font-weight: 800;
            line-height: 1.25;
            letter-spacing: 0.01em;
            padding: 2px 0 1px;
        }

        .score-card .score-label {
            margin-top: 3px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: #64748b;
        }

        .score-c {
            background: linear-gradient(180deg, #ecfdf5 0%, #f0fdf4 100%);
            border-color: #86efac;
        }
        .score-c .score-num { color: #166534; }

        .score-nc {
            background: linear-gradient(180deg, #fef2f2 0%, #fff1f2 100%);
            border-color: #fca5a5;
        }
        .score-nc .score-num { color: #b91c1c; }

        .score-na {
            background: linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%);
            border-color: #cbd5e1;
        }
        .score-na .score-num { color: #475569; }

        .score-rate {
            background: linear-gradient(180deg, #eff6ff 0%, #f0f9ff 100%);
            border-color: #93c5fd;
        }
        .score-rate .score-num { color: #1d4ed8; }

        .score-overall {
            background: #fff;
            border-color: #cbd5e1;
            flex: 1.35;
        }
        .score-overall--ok {
            background: linear-gradient(180deg, #ecfdf5 0%, #d1fae5 100%);
            border-color: #34d399;
        }
        .score-overall--ok .score-status { color: #047857; }
        .score-overall--action {
            background: linear-gradient(180deg, #fffbeb 0%, #fef3c7 100%);
            border-color: #fbbf24;
        }
        .score-overall--action .score-status { color: #b45309; }
        .score-overall--critical {
            background: linear-gradient(180deg, #fef2f2 0%, #fee2e2 100%);
            border-color: #f87171;
        }
        .score-overall--critical .score-status { color: #991b1b; }

        .tcontent {
            border: 1px solid #dbe3ec;
            border-radius: 12px;
            /* overflow:hidden on multi-page blocks creates blank trailing pages in Chromium PDF */
            overflow: visible;
            background: #fff;
            box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
        }

        .tcontent.tcontent--compliance {
            border-color: #c7e4d1;
        }

        .section-head {
            background: linear-gradient(90deg, #14532d 0%, #166534 70%, #1a7a3c 100%);
            color: #ffffff;
            font-size: 11.5px;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            padding: 9px 14px;
            border-top: none;
            border-bottom: none;
            break-inside: avoid;
            page-break-inside: avoid;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .section-head:first-child {
            border-top: none;
            border-radius: 11px 11px 0 0;
        }

        .section-head-meta {
            font-size: 10.5px;
            font-weight: 700;
            letter-spacing: 0.02em;
            text-transform: none;
            color: #14532d;
            background: rgba(255, 255, 255, 0.92);
            border: none;
            border-radius: 999px;
            padding: 3px 9px;
            white-space: nowrap;
        }

        .field-row {
            display: flex;
            align-items: stretch;
            border-bottom: 1px solid #e8eef5;
            min-height: 34px;
            break-inside: avoid;
            page-break-inside: avoid;
        }

        .field-row:last-child {
            border-bottom: none;
        }

        .field-row:nth-child(even of .field-row) {
            background: #fafbfc;
        }

        /* Safety audit / long checklist questions — match incident polish */
        .field-row.field-row--stack {
            flex-direction: column;
            align-items: stretch;
            min-height: 0;
        }

        .field-row.field-row--stack .field-label {
            width: 100%;
            border-right: none;
            border-bottom: 1px solid #eef2f7;
            padding-bottom: 6px;
        }

        .field-row.field-row--stack .field-value {
            width: 100%;
            justify-content: flex-start;
            padding-top: 6px;
        }

        .tcontent.tcontent--audit .field-label {
            width: 72%;
        }

        .tcontent.tcontent--audit .field-value {
            width: 28%;
            justify-content: flex-end;
        }

        .tcontent.tcontent--audit .field-row.field-row--stack .field-label,
        .tcontent.tcontent--audit .field-row.field-row--stack .field-value {
            width: 100%;
            justify-content: flex-start;
        }

        .field-label {
            width: 38%;
            flex-shrink: 0;
            background: #f8fafc;
            color: #334155;
            font-size: 11.5px;
            font-weight: 600;
            padding: 9px 12px;
            border-right: 1px solid #e8eef5;
            display: flex;
            align-items: center;
        }

        .field-value {
            width: 62%;
            padding: 9px 12px;
            color: #0f172a;
            font-size: 12.5px;
            font-weight: 500;
            display: flex;
            align-items: center;
            word-break: break-word;
        }

        .tcontent.tcontent--compliance .field-value {
            font-weight: 600;
        }

        .field-value .value-text {
            white-space: pre-wrap;
        }

        .field-value .value-text.muted {
            color: #9ca3af;
            font-weight: 400;
        }

        /* Legacy float layout still used by some helpers */
        .row {
            border-bottom: 1px solid #eef2f7;
        }

        .row:after {
            content: "";
            display: table;
            clear: both;
        }

        .item40, .item50, .item60, .item80, .item20, .item100 {
            float: left;
        }

        .item40 { width: 38%; }
        .item60 { width: 62%; }
        .item50 { width: 50%; }
        .item80 { width: 80%; }
        .item20 { width: 20%; }
        .item100 { width: 100%; }

        .tcontent .item40 {
            background: #f8fafc;
        }

        .tcontent .item40 .name {
            margin: 10px 14px;
            color: #475569;
            font-size: 12px;
            font-weight: 600;
        }

        .tcontent .item60 .value {
            margin: 10px 14px;
            color: #111827;
            font-size: 13px;
            font-weight: 500;
        }

        .pill {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 11.5px;
            font-weight: 700;
            letter-spacing: 0.02em;
            line-height: 1.25;
            white-space: nowrap;
        }

        .pill .pill-code {
            display: inline-block;
            min-width: 18px;
            text-align: center;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.04em;
            opacity: 0.9;
        }

        .pill-yes,
        .pill-compliant {
            background: #dcfce7;
            color: #166534;
            border: 1px solid #86efac;
            min-width: 34px;
            justify-content: center;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.04em;
        }

        .pill-no,
        .pill-noncompliant {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fca5a5;
            min-width: 34px;
            justify-content: center;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.04em;
        }

        .pill-na {
            background: #f1f5f9;
            color: #475569;
            border: 1px solid #cbd5e1;
            min-width: 34px;
            justify-content: center;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.04em;
        }

        .pill-select {
            background: #eff6ff;
            color: #1d4ed8;
            border: 1px solid #bfdbfe;
        }

        .pill-severity-low {
            background: #ecfdf5;
            color: #047857;
            border: 1px solid #a7f3d0;
        }

        .pill-severity-medium {
            background: #fffbeb;
            color: #b45309;
            border: 1px solid #fcd34d;
        }

        .pill-severity-high,
        .pill-severity-critical {
            background: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fca5a5;
        }

        /* Keep old yes/no classes for compatibility, restyle as pills */
        .tcontent .item60 .label {
            display: none;
        }

        .images {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-start;
            gap: 8px 10px;
            padding: 8px 0 10px;
            /* Cover .tcontent left/right border so photo rows have no side lines */
            margin-left: -1px;
            margin-right: -1px;
            width: calc(100% + 2px);
            box-sizing: border-box;
            background: #fff;
            border: none;
            border-bottom: none;
            outline: none;
            box-shadow: none;
            /* Photo grids may span pages. */
            break-inside: auto;
            page-break-inside: auto;
        }

        .images-item {
            /* Image 2 layout: 4 columns of larger portrait photos */
            flex: 0 0 calc(25% - 7.5px);
            margin: 0;
            min-width: 0;
            vertical-align: top;
            background: transparent;
            border: none;
            outline: none;
            box-shadow: none;
        }

        .images-item img {
            width: 100%;
            height: auto;
            max-height: 235px;
            object-fit: contain;
            object-position: top center;
            border-radius: 0;
            border: none;
            outline: none;
            box-shadow: none;
            display: block;
        }

        .images-block-label {
            width: 100%;
            font-size: 12px;
            font-weight: 600;
            color: #475569;
            margin-bottom: 4px;
        }

        .a-right {
            text-align: right;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-row">
                <div>
                    <img class="logo" src="{{LOGO_URL}}" alt="ServiceLink" />
                </div>
                <div class="header-contact">
                    <div class="company">Servicelink Pty Ltd</div>
                    <div>ABN 77 624 079 698</div>
                    <div>Suite 309/49-51 Queens Rd, Five Dock NSW 2046</div>
                    <div>Helpdesk@servicelink.net.au</div>
                    <div>www.servicelink.net.au</div>
                    <div>0420 220 220</div>
                </div>
            </div>
        </div>

        <div class="{{TITLE_BAR_CLASS}}">
            <div class="report-title">{{TITLE}}</div>
            <div class="title-bar-meta">
                {{SEVERITY_BADGE}}
                <div class="report-date">{{CUR_DATE}}</div>
            </div>
        </div>

        {{SCORECARD}}

        <div class="tcontent{{CONTENT_CLASS}}">
            {{CONTENT}}
        </div>
    </div>
</body>
</html>
