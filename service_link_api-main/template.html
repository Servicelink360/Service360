<html>
<head>
    <meta charset="UTF-8">
    <style>
        html {
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        * {
            box-sizing: border-box;
        }

        body {
            width: 740px;
            margin: 0 auto;
            font-family: 'Segoe UI', 'DejaVu Sans', 'Liberation Sans', Arial, sans-serif;
            color: #1f2937;
            background: #ffffff;
            font-size: 13px;
            line-height: 1.4;
        }

        .container {
            padding: 4px 8px 0;
        }

        .header {
            margin-bottom: 14px;
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 24px;
        }

        .logo {
            height: 78px;
            width: auto;
            display: block;
        }

        .header-contact {
            text-align: right;
            color: #4b5563;
            font-size: 11.5px;
            line-height: 1.55;
            padding-top: 6px;
        }

        .header-contact .company {
            color: #166534;
            font-weight: 700;
            font-size: 13px;
            margin-bottom: 2px;
        }

        .title-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            background: linear-gradient(90deg, #166534 0%, #22a05a 100%);
            color: #ffffff;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 14px;
        }

        .title-bar--severity-low {
            background: linear-gradient(90deg, #047857 0%, #34d399 100%);
        }

        .title-bar--severity-medium {
            background: linear-gradient(90deg, #b45309 0%, #f59e0b 100%);
        }

        .title-bar--severity-high {
            background: linear-gradient(90deg, #b91c1c 0%, #ef4444 100%);
        }

        .title-bar--severity-critical {
            background: linear-gradient(90deg, #7f1d1d 0%, #dc2626 55%, #991b1b 100%);
        }

        .title-bar .report-title {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.02em;
        }

        .title-bar-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .title-bar .report-date,
        .title-bar .report-severity {
            font-size: 12px;
            font-weight: 700;
            opacity: 0.98;
            background: rgba(255, 255, 255, 0.2);
            padding: 4px 10px;
            border-radius: 999px;
            white-space: nowrap;
        }

        .tcontent {
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            /* overflow:hidden on multi-page blocks creates blank trailing pages in Chromium PDF */
            overflow: visible;
            background: #fff;
        }

        .section-head {
            background: #f0fdf4;
            color: #166534;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            padding: 8px 12px;
            border-top: 1px solid #dcfce7;
            border-bottom: 1px solid #dcfce7;
            break-inside: avoid;
            page-break-inside: avoid;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .section-head:first-child {
            border-top: none;
        }

        .section-head-meta {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.02em;
            text-transform: none;
            color: #15803d;
            background: #ffffff;
            border: 1px solid #bbf7d0;
            border-radius: 999px;
            padding: 2px 8px;
            white-space: nowrap;
        }

        .field-row {
            display: flex;
            align-items: stretch;
            border-bottom: 1px solid #eef2f7;
            min-height: 32px;
            break-inside: avoid;
            page-break-inside: avoid;
        }

        .field-row:last-child {
            border-bottom: none;
        }

        .field-row:nth-child(even of .field-row) {
            background: #fafbfc;
        }

        /* Safety audit / long checklist questions — match incident polish */
        .field-row.field-row--stack {
            flex-direction: column;
            align-items: stretch;
            min-height: 0;
        }

        .field-row.field-row--stack .field-label {
            width: 100%;
            border-right: none;
            border-bottom: 1px solid #eef2f7;
            padding-bottom: 6px;
        }

        .field-row.field-row--stack .field-value {
            width: 100%;
            justify-content: flex-start;
            padding-top: 6px;
        }

        .tcontent.tcontent--audit .field-label {
            width: 72%;
        }

        .tcontent.tcontent--audit .field-value {
            width: 28%;
            justify-content: flex-end;
        }

        .tcontent.tcontent--audit .field-row.field-row--stack .field-label,
        .tcontent.tcontent--audit .field-row.field-row--stack .field-value {
            width: 100%;
            justify-content: flex-start;
        }

        .field-label {
            width: 38%;
            flex-shrink: 0;
            background: #f8fafc;
            color: #475569;
            font-size: 12px;
            font-weight: 600;
            padding: 8px 12px;
            border-right: 1px solid #eef2f7;
            display: flex;
            align-items: center;
        }

        .field-value {
            width: 62%;
            padding: 8px 12px;
            color: #111827;
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            word-break: break-word;
        }

        .field-value .value-text {
            white-space: pre-wrap;
        }

        .field-value .value-text.muted {
            color: #9ca3af;
            font-weight: 400;
        }

        /* Legacy float layout still used by some helpers */
        .row {
            border-bottom: 1px solid #eef2f7;
        }

        .row:after {
            content: "";
            display: table;
            clear: both;
        }

        .item40, .item50, .item60, .item80, .item20, .item100 {
            float: left;
        }

        .item40 { width: 38%; }
        .item60 { width: 62%; }
        .item50 { width: 50%; }
        .item80 { width: 80%; }
        .item20 { width: 20%; }
        .item100 { width: 100%; }

        .tcontent .item40 {
            background: #f8fafc;
        }

        .tcontent .item40 .name {
            margin: 10px 14px;
            color: #475569;
            font-size: 12px;
            font-weight: 600;
        }

        .tcontent .item60 .value {
            margin: 10px 14px;
            color: #111827;
            font-size: 13px;
            font-weight: 500;
        }

        .pill {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.02em;
            line-height: 1.3;
        }

        .pill-yes {
            background: #dcfce7;
            color: #166534;
            border: 1px solid #86efac;
        }

        .pill-no {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fca5a5;
        }

        .pill-select {
            background: #eff6ff;
            color: #1d4ed8;
            border: 1px solid #bfdbfe;
        }

        .pill-severity-low {
            background: #ecfdf5;
            color: #047857;
            border: 1px solid #a7f3d0;
        }

        .pill-severity-medium {
            background: #fffbeb;
            color: #b45309;
            border: 1px solid #fcd34d;
        }

        .pill-severity-high,
        .pill-severity-critical {
            background: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fca5a5;
        }

        /* Keep old yes/no classes for compatibility, restyle as pills */
        .tcontent .item60 .label {
            display: none;
        }

        .images {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-start;
            gap: 8px 10px;
            padding: 8px 0 10px;
            /* Cover .tcontent left/right border so photo rows have no side lines */
            margin-left: -1px;
            margin-right: -1px;
            width: calc(100% + 2px);
            box-sizing: border-box;
            background: #fff;
            border: none;
            border-bottom: none;
            outline: none;
            box-shadow: none;
            /* Photo grids may span pages. */
            break-inside: auto;
            page-break-inside: auto;
        }

        .images-item {
            /* Image 2 layout: 4 columns of larger portrait photos */
            flex: 0 0 calc(25% - 7.5px);
            margin: 0;
            min-width: 0;
            vertical-align: top;
            background: transparent;
            border: none;
            outline: none;
            box-shadow: none;
        }

        .images-item img {
            width: 100%;
            height: auto;
            max-height: 235px;
            object-fit: contain;
            object-position: top center;
            border-radius: 0;
            border: none;
            outline: none;
            box-shadow: none;
            display: block;
        }

        .images-block-label {
            width: 100%;
            font-size: 12px;
            font-weight: 600;
            color: #475569;
            margin-bottom: 4px;
        }

        .a-right {
            text-align: right;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-row">
                <div>
                    <img class="logo" src="{{LOGO_URL}}" alt="ServiceLink" />
                </div>
                <div class="header-contact">
                    <div class="company">Servicelink Pty Ltd</div>
                    <div>ABN 77 624 079 698</div>
                    <div>Suite 309/49-51 Queens Rd, Five Dock NSW 2046</div>
                    <div>Helpdesk@servicelink.net.au</div>
                    <div>www.servicelink.net.au</div>
                    <div>0420 220 220</div>
                </div>
            </div>
        </div>

        <div class="{{TITLE_BAR_CLASS}}">
            <div class="report-title">{{TITLE}}</div>
            <div class="title-bar-meta">
                {{SEVERITY_BADGE}}
                <div class="report-date">{{CUR_DATE}}</div>
            </div>
        </div>

        <div class="tcontent{{CONTENT_CLASS}}">
            {{CONTENT}}
        </div>
    </div>
</body>
</html>
