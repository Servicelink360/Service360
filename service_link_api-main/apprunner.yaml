version: 1.0
runtime: nodejs18
build:
  commands:
    build:
      - npm install --legacy-peer-deps
      - npm run build
run:
  runtime-version: 18
  command: npm run start:prod
  network:
    port: 5301
  env:
    - name: NODE_ENV
      value: production
    - name: DATABASE_SSL
      value: "true"
