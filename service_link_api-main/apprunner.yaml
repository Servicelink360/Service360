# AWS App Runner: connect GitHub → this folder → uses Dockerfile
# Console: App Runner → Create service → Source code → GitHub → /service_link_api-main

version: 1.0
runtime: nodejs18
build:
  commands:
    build:
      - npm install --legacy-peer-deps
      - npm run build
run:
  command: npm run start:prod
  network:
    port: 5301
  env:
    - name: NODE_ENV
      value: production
