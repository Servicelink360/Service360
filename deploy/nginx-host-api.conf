# Host nginx — install to /etc/nginx/sites-available/service360-api
# API: https://api.service360.com.au/  -> localhost:5301

server {
    listen 80;
    server_name api.service360.com.au;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name api.service360.com.au;

    ssl_certificate     /etc/letsencrypt/live/api.service360.com.au/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.service360.com.au/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 100M;

    location / {
        proxy_pass http://127.0.0.1:5301;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
