# Run on AWS EC2 (same host as API) for test/staging.
# Usage: docker compose -f deploy/docker-compose.aws-test.yml up -d --build
#
# Admin UI: http://EC2_PUBLIC_IP/  (port 80)
# API:      http://EC2_PUBLIC_IP:5301/

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  api:
    build:
      context: ../service_link_api-main
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../service_link_api-main/.env.prod
    environment:
      REDIS_IP: redis
      REDIS_PORT: "6379"
    ports:
      - "5301:5301"
    depends_on:
      - redis
    volumes:
      - api_uploads:/usr/src/app/public/uploads
      - ../deploy-status.json:/usr/src/app/deploy-status.json

  admin:
    build:
      context: ../service_link_admin-main
      dockerfile: Dockerfile
      args:
        # Hardcoded — do not use ${REACT_APP_ORDER_API_URL}; /opt/app/.env can override with a stale IP.
        REACT_APP_ORDER_API_URL: http://13.55.122.55:5301/
        REACT_APP_MODE: PROD
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  api_uploads:
