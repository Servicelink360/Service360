# Run on AWS EC2 (same host as API) for test/staging.
# Usage: docker compose -f deploy/docker-compose.aws-test.yml up -d --build

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  api:
    build:
      context: ../service_link_api-main
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../service_link_api-main/.env.prod
    environment:
      REDIS_IP: redis
      REDIS_PORT: "6379"
    ports:
      - "5301:5301"
    depends_on:
      - redis
    volumes:
      - api_uploads:/usr/src/app/public/uploads

volumes:
  api_uploads:
